services:
  backend:
    container_name: shader-toy-backend
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/diplom
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_ADMIN_USERNAME: ${ADMIN_USERNAME}
      SPRING_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      - db

  db:
    container_name: postgres
    image: postgres:16
    environment:
      POSTGRES_DB: diplom
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${DB_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


volumes:
  postgres_data: