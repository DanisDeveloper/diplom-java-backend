services:
  backend:
    container_name: shader-toy-backend
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/diplom
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_ADMIN_USERNAME: ${ADMIN_USERNAME}
      SPRING_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      - postgresql
      - redis

#  frontend:
#    container_name: shader-toy-frontend
#    build: /home/danis/WebstormProjects/Diplom
#    ports:
#      - "80:80"
#    depends_on:
#      - backend

  postgresql:
    container_name: postgresql
    image: postgres:16
    environment:
      POSTGRES_DB: diplom
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${DB_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    container_name: redis
    image: redis:latest
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_USER: ${REDIS_USER}
      REDIS_USER_PASSWORD: ${REDIS_USER_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "$REDIS_PASSWORD", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5


volumes:
  postgres_data:
  redis_data: