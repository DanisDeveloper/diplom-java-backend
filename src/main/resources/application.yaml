spring:
  application:
    name: diplom-back

  boot:
    admin:
      client:
        url: http://host.docker.internal:9090

  security:
    user:
      name: ${SPRING_ADMIN_USERNAME}
      password: ${SPRING_ADMIN_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: create-drop

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  data:
    redis:
      host: redis
      port: 6379

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    root: debug
    org.springframework.security: debug
  file:
    name: diplom.log


server:
  port: 8080


file:
  static-files: /opt/static